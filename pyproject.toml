[project]
name = "entrance-tagging"
version = "0.1.0"
description = "This project is to detect the main entrance of publich buildings based only on the available geospatial data on OpenStreetMap (OSM)."
readme = "README.md"
authors = [
    { name = "tiago-bd-olveira" }
]
requires-python = ">=3.14"
dependencies = [
    "imbalanced-learn>=0.13",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "statsmodels",
    "xlrd",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
